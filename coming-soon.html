    :root {
      --primary:   #2563eb;
      --secondary: #1e40af;
      --text:      #1f2937;
      --light:     #6b7280;
      --bg:        #ffffff;
      --section:   #f3f4f6;
      --radius:    1rem;
      --shadow:    0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -1px rgba(0,0,0,.06);
      --shadow-lg: 0 20px 25px -5px rgba(0,0,0,.12), 0 10px 10px -5px rgba(0,0,0,.06);
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body { font-family:'Poppins',sans-serif; color:var(--text); background:var(--bg); line-height:1.6; }
    a { text-decoration:none; }
    img { display:block; max-width:100%; }

    /* ── NAV ── */
    .navbar {
      position:fixed; top:0; left:0; right:0; height:66px;
      background:rgba(255,255,255,.96); backdrop-filter:blur(10px);
      border-bottom:1px solid rgba(0,0,0,.06); z-index:100;
      display:flex; align-items:center;
    }
    .nav-inner {
      max-width:1200px; margin:0 auto; padding:0 2rem; width:100%;
      display:flex; align-items:center; justify-content:space-between;
    }
    .back-btn {
      display:inline-flex; align-items:center; gap:.5rem;
      color:var(--primary); font-weight:600; font-size:.9rem;
      transition:gap .2s;
    }
    .back-btn:hover { gap:.8rem; }
    .lang-sw { display:flex; align-items:center; gap:.4rem; }
    .lang-sw span { color:var(--light); font-size:.85rem; }
    .lbtn {
      background:none; border:1.5px solid transparent; padding:3px 9px;
      border-radius:6px; cursor:pointer; font-size:.82rem; font-weight:500;
      color:var(--light); font-family:'Poppins',sans-serif; transition:all .2s;
    }
    .lbtn:hover { background:var(--section); color:var(--text); }
    .lbtn.active { border-color:var(--primary); color:var(--primary); }

    /* ── HERO ── */
    .hero {
      min-height:60vh;
      background:linear-gradient(135deg,#f0f9ff 0%,#dbeafe 50%,#ede9fe 100%);
      display:flex; align-items:center; justify-content:center;
      padding:100px 2rem 4rem; text-align:center; position:relative; overflow:hidden;
    }
    .hero::before {
      content:'';
      position:absolute; inset:0;
      background:radial-gradient(ellipse at 70% 40%, rgba(37,99,235,.08) 0%, transparent 60%);
    }
    .hero-body { position:relative; z-index:1; max-width:700px; }
    .project-icon-wrap {
      width:90px; height:90px; border-radius:50%;
      background:var(--primary); color:#fff;
      display:inline-flex; align-items:center; justify-content:center;
      font-size:2.4rem; margin-bottom:1.5rem;
      box-shadow:0 0 0 12px rgba(37,99,235,.12), var(--shadow-lg);
    }
    .status-badge {
      display:inline-flex; align-items:center; gap:.45rem;
      background:#dcfce7; color:#16a34a;
      padding:.3rem .9rem; border-radius:50px;
      font-size:.8rem; font-weight:600; margin-bottom:1.2rem;
      border:1px solid #86efac;
    }
    .status-badge span.dot {
      width:8px; height:8px; border-radius:50%; background:#16a34a;
      animation:pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100%{ opacity:1; transform:scale(1); }
      50%    { opacity:.5; transform:scale(1.3); }
    }
    .hero h1 {
      font-size:clamp(1.7rem,4vw,2.8rem); font-weight:700;
      color:var(--text); margin-bottom:.8rem; line-height:1.25;
    }
    .hero p.tagline {
      font-size:clamp(.95rem,2vw,1.1rem); color:var(--light);
      max-width:560px; margin:0 auto;
    }

    /* ── MAIN CONTENT ── */
    .content { max-width:900px; margin:0 auto; padding:4rem 2rem 6rem; }

    /* info cards row */
    .info-grid {
      display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:1.2rem; margin-bottom:3rem;
    }
    .info-card {
      background:var(--section); border-radius:var(--radius);
      padding:1.4rem 1.6rem; display:flex; flex-direction:column; gap:.4rem;
    }
    .info-card .ic-label {
      font-size:.75rem; font-weight:600; text-transform:uppercase;
      letter-spacing:.08em; color:var(--light);
    }
    .info-card .ic-value {
      font-size:1rem; font-weight:600; color:var(--text);
      display:flex; align-items:center; gap:.5rem;
    }
    .info-card .ic-value i { color:var(--primary); font-size:1rem; }

    /* section blocks */
    .block { margin-bottom:2.8rem; }
    .block h2 {
      font-size:1.3rem; font-weight:700; color:var(--text);
      margin-bottom:1rem; display:flex; align-items:center; gap:.6rem;
    }
    .block h2 i { color:var(--primary); font-size:1.1rem; }
    .block p { color:var(--light); font-size:.95rem; line-height:1.85; }

    /* features list */
    .features { list-style:none; display:flex; flex-direction:column; gap:.65rem; }
    .features li {
      display:flex; align-items:flex-start; gap:.75rem;
      color:var(--light); font-size:.93rem; line-height:1.7;
    }
    .features li i {
      color:var(--primary); margin-top:.2rem; flex-shrink:0;
    }

    /* tech stack */
    .tech-stack { display:flex; flex-wrap:wrap; gap:.6rem; }
    .tech-badge {
      display:inline-flex; align-items:center; gap:.35rem;
      background:var(--section); color:var(--text);
      padding:.35rem .9rem; border-radius:50px;
      font-size:.82rem; font-weight:500;
      border:1px solid rgba(0,0,0,.06);
    }
    .tech-badge i { color:var(--primary); }

    /* progress */
    .progress-wrap { margin-top:.8rem; }
    .progress-bar-bg {
      height:8px; background:#e5e7eb; border-radius:50px; overflow:hidden;
    }
    .progress-bar {
      height:100%; background:linear-gradient(90deg,var(--primary),#60a5fa);
      border-radius:50px; transition:width 1.2s ease;
    }
    .progress-label {
      display:flex; justify-content:space-between;
      font-size:.8rem; color:var(--light); margin-top:.4rem;
    }

    /* divider */
    .divider { border:none; border-top:1px solid #e5e7eb; margin:2.5rem 0; }

    /* CTA */
    .cta-section { text-align:center; padding-top:1rem; }
    .cta-section p { color:var(--light); font-size:.9rem; margin-bottom:1.5rem; }
    .btn {
      display:inline-flex; align-items:center; gap:.5rem;
      padding:.7rem 1.8rem; border-radius:50px;
      font-family:'Poppins',sans-serif; font-size:.92rem; font-weight:500;
      cursor:pointer; border:2px solid transparent; transition:all .25s;
    }
    .btn-primary { background:var(--primary); color:#fff; border-color:var(--primary); }
    .btn-primary:hover {
      background:var(--secondary); border-color:var(--secondary);
      transform:translateY(-2px); box-shadow:0 8px 20px rgba(37,99,235,.35);
    }
    .btn-outline { background:transparent; color:var(--primary); border-color:var(--primary); }
    .btn-outline:hover {
      background:var(--primary); color:#fff;
      transform:translateY(-2px);
    }
    .cta-btns { display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; }

    /* footer */
    .footer {
      background:var(--text); color:var(--light);
      text-align:center; padding:1.5rem 2rem; font-size:.85rem;
    }

    /* responsive */
    @media(max-width:600px){
      .content{ padding:3rem 1.2rem 4rem; }
      .info-grid{ grid-template-columns:1fr 1fr; }
    }

</head>
